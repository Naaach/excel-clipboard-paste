name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed and creates the GitHub
# release. It can also be triggered manually from the Actions tab.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# queue simultaneous publishes, never run them in parallel
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance signing (npm publish --provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # npm reads it through the .npmrc generated by setup-node with registry-url.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Check the NPM_TOKEN secret
        if: env.NODE_AUTH_TOKEN == ''
        run: |
          echo "::error::The NPM_TOKEN secret is missing. Add it under Settings → Secrets and variables → Actions (an Automation token from npmjs.com)."
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${VERSION} in package.json"
            exit 1
          fi

      - name: Checks (typecheck + test + build + size)
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm size

      - name: Check whether the version is already published
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already published; skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        run: npm publish --access public --provenance

      - name: Create the GitHub release
        if: steps.published.outputs.exists != 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
